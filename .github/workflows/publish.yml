name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          # Do not restore dependency caches in the privileged release job.
          package-manager-cache: false

      # npm 11.5.1+ supports trusted publishing. Pin the CLI for reproducibility.
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.6.2

      - name: Check release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@simonswine/grafana-flamegraph') {
            throw new Error('Unexpected package name');
          }
          if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must match package.json version');
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm audit --prod

      - name: Build
        run: |
          pnpm build
          pnpm build-storybook

      - name: Publish with trusted identity and provenance
        run: npm publish --provenance --access public
